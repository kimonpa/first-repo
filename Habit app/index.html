<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My Habits</h1>

    <form id="habit-form">
      <input type="text" id="habit-input" placeholder="New habit, e.g. Read 10 pages" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="habit-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
